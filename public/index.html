<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>프로젝트 런처</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
</head>
<body>
  <header>
    <h1 data-i18n="appTitle">프로젝트 런처</h1>
    <div class="header-actions">
      <div class="lang-switch" id="lang-switch">
        <button type="button" data-lang="ko">한국어</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ja">日本語</button>
      </div>
      <div class="theme-switch" id="theme-switch" role="group">
        <button type="button" data-theme="system" data-i18n="themeSystem" data-i18n-title="themeSystemTitle">자동</button>
        <button type="button" data-theme="light" data-i18n-title="themeLightTitle" aria-label="light">☀️</button>
        <button type="button" data-theme="dark" data-i18n-title="themeDarkTitle" aria-label="dark">🌙</button>
      </div>
      <button id="help-btn" type="button" class="ghost"><span aria-hidden="true">❓</span> <span data-i18n="help">📖 사용법</span></button>
      <button id="new-project" type="button" data-i18n="newProject">+ 새 프로젝트</button>
      <button id="clone-project" type="button" data-i18n="cloneProject">⬇ 가져오기</button>
      <button id="update-btn" type="button" class="ghost" data-i18n="updateBtn">⟳ 업데이트</button>
      <button id="refresh" type="button" data-i18n="refresh">새로고침</button>
      <button id="shutdown" type="button" class="danger" data-i18n="shutdown">서버 종료</button>
    </div>
  </header>
  <div class="root-line"><span data-i18n="rootLabel">스캔 폴더</span> <code id="root-path">…</code> <button id="root-change" type="button" class="ghost small" data-i18n="rootChange">변경</button></div>
  <div id="banner" class="banner hidden"></div>
  <main id="grid" class="grid"></main>

  <section id="console-drawer" class="console-drawer">
    <div class="console-bar">
      <span class="console-title" id="console-title"></span>
      <button id="console-collapse" type="button" class="console-collapse" data-i18n-title="collapseTitle" title="접기/펼치기">▾</button>
    </div>
    <div id="console-pane" class="console-pane"></div>
  </section>

  <div id="help-modal" class="help-modal hidden" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="help-dialog">
      <div class="help-head">
        <h2 id="help-title"></h2>
        <button id="help-close" class="help-close" type="button">✕</button>
      </div>
      <ul id="help-list" class="help-list"></ul>
      <a id="help-guide" class="help-guide" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>

  <div id="import-modal" class="help-modal hidden" role="dialog" aria-modal="true" aria-labelledby="import-title">
    <div class="help-dialog">
      <div class="help-head">
        <h2 id="import-title"></h2>
        <button id="import-close" class="help-close" type="button">✕</button>
      </div>
      <input id="import-search" class="import-search" type="text" />
      <div id="import-status" class="import-status hidden"></div>
      <ul id="import-list" class="import-list"></ul>
    </div>
  </div>

  <div id="create-modal" class="help-modal hidden" role="dialog" aria-modal="true" aria-labelledby="create-title">
    <div class="help-dialog">
      <div class="help-head">
        <h2 id="create-title"></h2>
        <button id="create-close" class="help-close" type="button">✕</button>
      </div>
      <input id="create-input" class="import-search" type="text" />
      <div id="create-error" class="import-status hidden"></div>
      <div class="create-actions">
        <button id="create-cancel" type="button" class="ghost"></button>
        <button id="create-submit" type="button"></button>
      </div>
    </div>
  </div>

  <div id="delete-modal" class="help-modal hidden" role="dialog" aria-modal="true" aria-labelledby="delete-title">
    <div class="help-dialog">
      <div class="help-head">
        <h2 id="delete-title"></h2>
        <button id="delete-close" class="help-close" type="button">✕</button>
      </div>
      <p id="delete-desc" class="global-status"></p>
      <p id="delete-running" class="banner hidden"></p>
      <label id="delete-gh-row" class="delete-gh hidden">
        <input id="delete-gh-check" type="checkbox" />
        <span id="delete-gh-label"></span>
      </label>
      <div id="delete-error" class="import-status hidden"></div>
      <div class="create-actions">
        <button id="delete-cancel" type="button" class="ghost"></button>
        <button id="delete-submit" type="button" class="danger-solid"></button>
      </div>
    </div>
  </div>

  <div id="note-modal" class="help-modal hidden" role="dialog" aria-modal="true" aria-labelledby="note-title">
    <div class="help-dialog">
      <div class="help-head">
        <h2 id="note-title"></h2>
        <button id="note-close" class="help-close" type="button">✕</button>
      </div>
      <p id="note-desc" class="global-status"></p>
      <input id="note-input" class="import-search" type="text" />
      <div id="note-error" class="import-status hidden"></div>
      <div class="create-actions">
        <button id="note-cancel" type="button" class="ghost"></button>
        <button id="note-submit" type="button"></button>
      </div>
    </div>
  </div>

  <div id="update-modal" class="help-modal hidden" role="dialog" aria-modal="true" aria-labelledby="update-title">
    <div class="help-dialog">
      <div class="help-head">
        <h2 id="update-title"></h2>
        <button id="update-close" class="help-close" type="button">✕</button>
      </div>
      <p id="update-status" class="global-status"></p>
      <div id="update-error" class="import-status hidden"></div>
      <div class="create-actions">
        <button id="update-cancel" type="button" class="ghost"></button>
        <button id="update-submit" type="button"></button>
      </div>
    </div>
  </div>

  <!-- xterm UMD: 전역 Terminal, FitAddon 노출 (app/console 모듈보다 먼저 로드) -->
  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="./theme.js" type="module"></script>
  <script src="./console.js" type="module"></script>
  <script src="./app.js" type="module"></script>
  <script src="./update.js" type="module"></script>
  <script src="./help.js" type="module"></script>
</body>
</html>
